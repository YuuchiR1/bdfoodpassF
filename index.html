async function photo(q){
  if(IMG[q]!==undefined)return IMG[q];
  try{
    const r=await fetch(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=3&prop=pageimages&piprop=thumbnail&pithumbsize=320&format=json&origin=*`,{signal:AbortSignal.timeout(5000)});
    const j=await r.json();const pages=Object.values(j.query?.pages||{}).sort((a,b)=>a.index-b.index);
    const p=pages.find(p=>p.thumbnail);IMG[q]=p?p.thumbnail.source:"";
  }catch{IMG[q]="";}
  try{localStorage.setItem("fp_img",JSON.stringify(IMG));}catch{}return IMG[q];
}

function download(){if(!cardBlob)return;const a=document.createElement("a");a.href=cardURL;a.download=fname();document.body.appendChild(a);a.click();a.remove();}
$("dl").onclick=()=>{download();toast(tr("Your passport image is ready to save","আপনার পাসপোর্টের ছবি সংরক্ষণের জন্য প্রস্তুত"));};
function shareText(){return tr(`I've tried ${sel.size}/${ALL.length} Bangladeshi dishes! My foodie rank: ${level(sel.size)[0]}.`,`বাংলাদেশের ${num(ALL.length)}টি খাবারের মধ্যে ${num(sel.size)}টি খেয়েছি! আমার স্তর: ${level(sel.size)[0]}।`);}
$("share").onclick=async()=>{
 if(!cardBlob)return;const file=new File([cardBlob],fname(),{type:"image/png"});
 if(navigator.canShare?.({files:[file]})){
 try{await navigator.share({files:[file],title:tr("My Food Passport","আমার ফুড পাসপোর্ট")});$("shareStatus").textContent=tr("Passport passed to your chosen app.","পাসপোর্ট আপনার বাছা অ্যাপে পাঠানো হয়েছে।");}
 catch(e){if(e.name==="AbortError")return;$("shareStatus").textContent=tr("Image sharing was blocked. Open this page in your phone browser, or download the image and attach it in your app.","ছবি শেয়ার বন্ধ আছে। ফোনের ব্রাউজারে পেজটি খুলুন, অথবা ছবি ডাউনলোড করে আপনার অ্যাপে যোগ করুন।");}
 }else{download();$("shareStatus").textContent=tr("This browser cannot send image files to social apps. Your card is ready to save; attach the PNG in Facebook, Messenger, WhatsApp or another app. On supported phones, Share opens the app chooser.","এই ব্রাউজার থেকে সামাজিক অ্যাপে ছবি পাঠানো যায় না। কার্ডটি সংরক্ষণ করে Facebook, Messenger, WhatsApp বা অন্য অ্যাপে যোগ করুন। সমর্থিত ফোনে শেয়ার চাপলে অ্যাপ বাছাই খুলবে।");}
};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(shareText());toast(tr("Share text copied","শেয়ারের লেখা কপি হয়েছে"));}catch{toast(tr("Clipboard unavailable in this browser","এই ব্রাউজারে কপি করা যাচ্ছে না"));}};
localized();
</script>
</body>
</html>
